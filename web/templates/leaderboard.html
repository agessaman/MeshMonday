<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MeshMonday Leaderboard</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body data-poll-seconds="{{.UIPollSeconds}}">
  <main class="page">
    <header class="hero hero-leaderboard">
      <div class="hero-title-block">
        <p class="eyebrow">{{.MeshName}}</p>
        <h1>MeshMonday Leaderboard</h1>
      </div>
      <p class="subtitle">Tracking from {{.TrackedFrom}}</p>
      <nav class="nav hero-leaderboard-nav">
        <a href="/">Check-ins</a>
        <a href="/leaderboard">Leaderboard</a>
      </nav>
      <label class="leaderboard-search-label">
        <span class="sr-only">Filter leaderboard by name</span>
        <input type="search" id="leaderboard-filter" class="leaderboard-search" placeholder="Search people…" autocomplete="off" spellcheck="false">
      </label>
    </header>

    <section class="board">
      {{range .Entries}}
      <article class="board-row" data-username="{{.Username}}" data-display-name="{{.DisplayName}}">
        <div class="board-user">
          <img src="https://api.dicebear.com/9.x/{{$.DiceBearStyle}}/svg?seed={{.Username}}" alt="{{.DisplayName}} avatar" loading="lazy">
          <div>
            <h2>{{.DisplayName}}</h2>
          </div>
        </div>
        <div class="rings">
          <div class="ring-wrap">
            <div class="ring most" style="--ring-fill-pct: {{leaderboardRingFill .MostCheckins .SeasonWeeks}};">
              <span>{{.MostCheckins}}</span>
            </div>
            <small class="ring-label-total">Total<br>Checkins</small>
          </div>
          <div class="ring-wrap">
            <div class="ring streak" style="--ring-fill-pct: {{leaderboardRingFill .LongestStreak .SeasonWeeks}};">
              <span>{{.LongestStreak}}</span>
            </div>
            <small>Longest Streak<br>{{.StreakStartDate}}</small>
          </div>
        </div>
      </article>
      {{else}}
      <p class="empty board-server-empty">No leaderboard data yet.</p>
      {{end}}
      <p class="empty board-filter-empty" hidden>No names match your search.</p>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
